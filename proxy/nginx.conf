worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. HTTP -> HTTPS Redirect
    server {
        listen 80;
        server_name uit.warranty.com api.warranty.com localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Main HTTPS Application (uit.warranty.com & localhost)
    server {
        listen 443 ssl;
        server_name uit.warranty.com localhost;

        ssl_certificate     /etc/nginx/certs/warranty.crt;
        ssl_certificate_key /etc/nginx/certs/warranty.key;

        client_max_body_size 50M;

        # Core Backend API Gateway
        location /api/ {
            proxy_pass http://core:5001/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 90s;
        }

        # CRM Next.js Frontend
        location / {
            proxy_pass http://crm:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 90s;
        }
    }

    # 3. Dedicated API HTTPS Subdomain (api.warranty.com)
    server {
        listen 443 ssl;
        server_name api.warranty.com;

        ssl_certificate     /etc/nginx/certs/warranty.crt;
        ssl_certificate_key /etc/nginx/certs/warranty.key;

        client_max_body_size 50M;

        location / {
            proxy_pass http://core:5001/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 90s;
        }
    }
}
